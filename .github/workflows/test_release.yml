name: Create release wheels / Do not publish!

on: workflow_dispatch

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]

    steps:
      - uses: actions/checkout@v4

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5

      - name: Download OpenCL SDK
        if: matrix.os == 'windows-latest'
        uses: suisei-cn/actions-download-file@818d6b7dc8fe73f2f924b6241f2b1134ca1377d9
        with:
          url: "https://github.com/GPUOpen-LibrariesAndSDKs/OCL-SDK/files/1406216/lightOCLSDK.zip"
          target: "."
          retry-times: 3
          
      - name: Unzip OpenCL SDK
        if: matrix.os == 'windows-latest'
        run: |
          mkdir OCLSDK
          7z x lightOCLSDK.zip -oOCLSDK

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        if: runner.os != 'macOS'
        env:
          CIBW_BEFORE_BUILD: |
            mkdir -p /io/vcpkg-logs || true
            cp -r /project/vcpkg/buildtrees /io/vcpkg-logs/ || true
            cp /project/vcpkg-manifest-install.log /io/vcpkg-logs/ || true
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Build wheels
        if: runner.os == 'macOS'
        env:
          CMAKE_GENERATOR: Xcode
          MACOSX_DEPLOYMENT_TARGET: 10.14
          VCPKG_ENV_PASSTHROUGH: MACOSX_DEPLOYMENT_TARGET
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.os }}
          path: |
            vcpkg-logs/**
            vcpkg/buildtrees/**/*.log
            vcpkg/buildtrees/**/config-*-out.log
            vcpkg-manifest-install.log

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
  sdist:
    name: Create source release
    
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5

    - name: Install build package
      run: python -m pip install build

    - name: Create source distribution
      run: python -m build -s

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-sdist
        path: ./dist/*